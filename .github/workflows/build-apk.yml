name: Build FutGoal Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Sync Web Assets
        run: |
          mkdir -p www
          cp -r index.html images manifest.json www/
          npm install --no-audit
          npx cap sync android

      - name: Build Android APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy & Prepare APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FutGoal.apk
          ls -lh FutGoal.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FutGoal-Android-APK
          path: FutGoal.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "FutGoal Android APK v1.0.${{ github.run_number }}"
          body: |
            ## ⚽ FutGoal Rasmiy Mobil Ilovasi (Android APK)
            
            Ushbu APK fayli GitHub orqali avtomatik tarzda yaratildi.
            
            ### 📲 Qanday o'rnatiladi?
            1. Quyidagi **Assets** bo'limidan `FutGoal.apk` faylini telefoningizga yuklab oling.
            2. Faylni ochib, **"O'rnatish" (Install)** tugmasini bosing.
            3. *Eslatma*: Agar telefonda "Noma'lum manbalardan o'rnatish" so'ralsa, ruxsat bering.
            
            ---
            - 🌐 **Jonli Vebsayt & Server**: https://futgoal-backend-production.up.railway.app
            - ⚡ **Backend API**: Online (Railway Cloud)
            - 📦 **Paket ID**: `com.futgoal.app`
          files: FutGoal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
